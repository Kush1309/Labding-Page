<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E2E"/>
      <stop offset="100%" stop-color="#D90000"/>
    </linearGradient>
  </defs>
  <!-- Background Container for Crisp Visibility on Light/Dark Browser Chrome -->
  <rect width="64" height="64" rx="14" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Foundation Dark Path -->
  <path d="M 32 30
           C 25 30 16 34 16 43
           C 16 52 26 56 36 56
           C 46 56 52 50 52 42
           C 52 35 46 33 40 33
           C 34 33 30 35 30 39
           C 30 42 33 45 37 45"
        stroke="#111111"
        stroke-width="5.5"
        stroke-linecap="round"
        fill="none"/>

  <!-- Upper Vibrant Red Arc -->
  <path d="M 32 34
           C 39 34 48 30 48 21
           C 48 12 38 8 28 8
           C 18 8 12 14 12 22
           C 12 29 18 31 24 31
           C 30 31 34 29 34 25
           C 34 22 31 19 27 19"
