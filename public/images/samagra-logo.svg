<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" fill="none">
  <defs>
    <linearGradient id="logoRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E2E"/>
      <stop offset="100%" stop-color="#D90000"/>
    </linearGradient>
    <linearGradient id="logoDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3139"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>

  <!-- Left Symbol (50x50 area) -->
  <g transform="translate(10, 10)">
    <circle cx="25" cy="25" r="22" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
    <!-- Dark lower loop -->
    <path d="M 25 24 C 20 24 12 27 12 34 C 12 41 20 44 28 44 C 36 44 42 39 42 33 C 42 28 37 26 32 26 C 27 26 23 28 23 31.5 C 23 34.5 25.5 36.5 29 36.5"
          stroke="url(#logoDark)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- Red upper loop -->
    <path d="M 25 26 C 30 26 38 23 38 16 C 38 9 30 6 22 6 C 14 6 8 11 8 17 C 8 22 13 24 18 24 C 23 24 27 22 27 18.5 C 27 15.5 24.5 13.5 21 13.5"
          stroke="url(#logoRed)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- Core node -->
    <circle cx="25" cy="25" r="3" fill="#D90000"/>
    <circle cx="25" cy="25" r="1.5" fill="#FFFFFF"/>
    <!-- Satellite node -->
    <circle cx="38" cy="9" r="2" fill="#D90000"/>
  </g>

  <!-- Brand Wordmark -->
  <text x="75" y="44" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" letter-spacing="1.5" fill="#111111">
    SAMAGRA
  </text>
  <circle cx="242" cy="41" r="3.5" fill="#D90000"/>

  <!-- Subtitle / Tagline -->
  <text x="76" y="58" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="8.5" letter-spacing="2.5" fill="#888888">
    INTELLIGENT EDUCATION PLATFORM
  </text>
</svg>
